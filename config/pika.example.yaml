version: 2
repo: /path/to/clean/git/repo
workspace: /path/to/pika-workspace

agents:
  baseline_alignment: &writer
    backend: codex
    model: gpt-5.6
    reasoning_effort: high
    approval_policy: never
    sandbox: workspace-write

  baseline_verify:
    <<: *writer
    max_followups: 8

  iteration:
    history_limit: 20
    max_followups: 5
    max_pending_attempts: 0
    agents:
      - <<: *writer

  integration:
    <<: *writer
    max_followups: 8
    regression_feedback_cases: 3

  progress_summary:
    interval: 5m
    timezone: Asia/Shanghai
    backend: codex
    reasoning_effort: low
    approval_policy: never
    sandbox: read-only
    max_followups: 3
