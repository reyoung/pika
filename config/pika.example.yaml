server:
  host: 127.0.0.1
  port: 8080

backend:
  type: codex_app_server
  command:
    - codex
    - app-server
    - --listen
    - stdio://
  approval_policy: never
  sandbox_policy: danger_full_access
  protocol_config: {}

campaign:
  plan: false
  max_attempts: null
  history_n: 10
  iteration_agents:
    - name: codex-1
      backend: codex_app_server
      reasoning_effort: high
      approval_policy: never
      sandbox_policy: danger_full_access
  reference_catalog: []
  stop_conditions:
    mode: all_goals

sync:
  remote: origin
  branch: main
