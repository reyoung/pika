server:
  host: 127.0.0.1
  port: 8080

backend:
  type: codex_app_server
  command:
    - codex
    - app-server
    - --listen
    - stdio://
  approval_policy: never
  sandbox_policy: danger_full_access
  protocol_config: {}

campaign:
  plan: false
  max_attempts: null
  # New Iteration dispatch pauses once this many completed candidates await Integration.
  # 0 means wait for every completed candidate to finish Integration before dispatching again.
  max_unverified_attempts: 0
  history_n: 10
  iteration_agents:
    - name: codex-1
      backend: codex_app_server
      reasoning_effort: high
      approval_policy: never
      sandbox_policy: danger_full_access
  integration_agent:
    name: integration
    backend: codex_app_server
    reasoning_effort: high
    approval_policy: never
    sandbox_policy: danger_full_access
  # Optional read-only AI progress report. Disabled by default.
  progress_summary:
    enabled: false
    interval_minutes: 10
    name: progress-summary
    backend: codex_app_server
    reasoning_effort: medium
    approval_policy: never
    sandbox_policy: read_only
  reference_catalog: []
  stop_conditions:
    mode: all_goals

sync:
  remote: origin
  branch: main
