version: 2
repo: /path/to/clean/git/repo
workspace: /path/to/pika-workspace
token: replace-with-a-long-random-token

agents:
  baseline_alignment: &writer
    backend: codex
    model: gpt-5.6
    reasoning_effort: high
    approval_policy: never
    sandbox: danger-full-access

  baseline_verify:
    <<: *writer
    max_followups: 8

  iteration:
    history_limit: 20
    max_followups: 5
    max_pending_attempts: 0
    agents:
      - <<: *writer

  integration:
    <<: *writer
    fallbacks:
      - backend: cursor_headless
        model: gpt-5.6-sol-high
        reasoning_effort: high
        approval_policy: force
        sandbox: disabled
      - backend: codex
        model: another-model
        reasoning_effort: medium
        approval_policy: never
        sandbox: danger-full-access
    max_followups: 8
    regression_feedback_cases: 3

  progress_summary:
    interval: 5m
    timezone: Asia/Shanghai
    backend: codex
    reasoning_effort: low
    approval_policy: never
    sandbox: danger-full-access
    max_followups: 3
